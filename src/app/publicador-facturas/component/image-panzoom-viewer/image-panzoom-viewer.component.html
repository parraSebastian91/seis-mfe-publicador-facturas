<section class="image-viewer-shell">
  <div class="toolbar">
    <button *ngIf="mobileMode" app-button variant="light" type="button" (click)="toggleInteraction()">
      {{ interactionEnabled ? 'Bloquear gesto' : 'Activar gesto' }}
    </button>
    <button app-icon-button type="button" (click)="zoomOut()" aria-label="Alejar">
      <app-icon name="zoom_out" />
    </button>
    <button app-icon-button type="button" (click)="reset()" aria-label="Restablecer zoom">
      <app-icon name="restart_alt" />
    </button>
    <button app-icon-button type="button" (click)="zoomIn()" aria-label="Acercar">
      <app-icon name="zoom_in" />
    </button>
  </div>

  <div class="viewport" #viewport [class.interaction-enabled]="interactionEnabled">
    <img #imageEl [src]="imageSrc" [alt]="altText" draggable="false" />
  </div>
</section>
