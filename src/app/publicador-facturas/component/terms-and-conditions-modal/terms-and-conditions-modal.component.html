<app-confirm-dialog
  [open]="isOpen"
  title="Términos y Condiciones de Publicación"
  confirmLabel="Aceptar términos"
  cancelLabel="Revisar publicación"
  loadingLabel="Procesando..."
  [loading]="isSubmitting"
  [error]="errorMessage || null"
  maxWidth="560px"
  (confirmed)="onAccept()"
  (cancelled)="onDismiss()">

  <div class="tnc">
    <p class="tnc__factura-ref">{{ facturaLabel }}</p>
    <h3 class="tnc__section-title">{{ tncTitle }}</h3>
    <section class="tnc__content" aria-label="Contenido de términos y condiciones">
      {{ tncText }}
    </section>
    <p class="tnc__version" *ngIf="versionTerminos">Versión: {{ versionTerminos.codigo }}</p>
  </div>
</app-confirm-dialog>
