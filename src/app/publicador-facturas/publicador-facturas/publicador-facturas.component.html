<section class="publicador-wrapper">

  <header class="header-row">
    <div>
      <h1>Publicador de Facturas</h1>
      <p>Carga, validación y publicación de comprobantes.</p>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-filtros-mobile" *ngIf="facturas.length" (click)="openMobileFiltersModal()">
        Filtros
        <span class="filtros-count" *ngIf="activeFilterCount > 0">{{ activeFilterCount }}</span>
      </button>
      <button type="button" class="btn-publicar" (click)="openUploadModal()">Publicar</button>
    </div>
  </header>

  <div class="contenido">
    <div class="estado-chips" *ngIf="facturas.length">
      <button
        *ngFor="let chip of estadoChips"
        type="button"
        class="estado-chip"
        [class.active]="isChipActive(chip.value)"
        (click)="toggleEstadoChip(chip.value)">
        {{ chip.label }}
      </button>
    </div>

    <div class="filtro-row" *ngIf="facturas.length">
      <app-atomic-factura-filters [facturas]="facturas" [isAdmin]="isAdminUser" [filters]="activeFilters"
        (filtersChange)="onFiltersChange($event)">
      </app-atomic-factura-filters>
    </div>

    <div class="contenedor-lista" *ngIf="filteredFacturas.length">
      <ul class="estado-lista">
        <li *ngFor="let factura of paginatedFacturas; trackBy: trackByFacturaId"
          [class.factura-just-published]="isFacturaRecentlyPublished(factura)">
          <app-factura-view [factura]="factura" (facturaChange)="handleFacturaChange($event)"
            (confirmFacturaRequest)="publicarFactura($event)"
            (uploadRespaldoRequest)="handleUploadRespaldoRequest($event)">
          </app-factura-view>
        </li>
      </ul>
      <div class="cargar-mas-row" *ngIf="hasMore">
        <button type="button" class="btn-cargar-mas" (click)="loadMore()">Cargar más</button>
      </div>
    </div>

    <div class="estado-vacio-cta" *ngIf="!facturas.length">
      <mat-icon class="empty-icon">receipt_long</mat-icon>
      <h2 class="empty-title">No tienes facturas aún</h2>
      <p class="empty-desc">Publica tu primera factura para comenzar a recibir financiamiento.</p>
      <button type="button" class="btn-publicar" (click)="openUploadModal()">+ Nueva Factura</button>
    </div>

    <p class="estado-vacio" *ngIf="facturas.length && !filteredFacturas.length">No hay facturas que coincidan con los
      filtros seleccionados.</p>
  </div>
</section>

<app-modal-publicacion-factura [isOpen]="isPublicationModalOpen" [isSubmitting]="isPublishing"
  [metadata]="publicationMetadata"
  [errorMessage]="modalErrorMessage"
  (closeModal)="closePublicationModal()" (submitFile)="handleFilePublish($event)"
  (submitForm)="publicarFactura($event)">
</app-modal-publicacion-factura>

<div class="mobile-filters-modal" *ngIf="isMobileFiltersModalOpen" (click)="closeMobileFiltersModal()">
  <section class="mobile-filters-panel" role="dialog" aria-modal="true" aria-label="Filtros de facturas"
    (click)="$event.stopPropagation()">
    <header class="mobile-filters-header">
      <h2>Filtros</h2>
      <button type="button" class="btn-close-filters" (click)="closeMobileFiltersModal()">Cerrar</button>
    </header>

    <app-atomic-factura-filters [facturas]="facturas" [isAdmin]="isAdminUser" [filters]="mobileDraftFilters"
      (filtersChange)="onMobileFiltersDraftChange($event)">
    </app-atomic-factura-filters>

    <footer class="mobile-filters-footer">
      <button type="button" class="btn-cancel-filters" (click)="cancelMobileFilters()">Cancelar</button>
      <button type="button" class="btn-apply-filters" (click)="applyMobileFilters()">Aplicar</button>
    </footer>
  </section>
</div>
